<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="skylineLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="carShadowSoft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- City Skyline Silhouette (Light gray architectural wireframe) -->
  <g stroke="url(#skylineLine)" stroke-width="1.2" fill="url(#skylineGrad)">
    <!-- Sail shaped building / Burj Al Arab style on left -->
    <path d="M 120,250 C 130,190 125,120 150,70 C 170,120 185,190 190,250 Z" />
    <path d="M 150,70 L 150,250" stroke-width="0.8"/>
    <line x1="135" y1="130" x2="165" y2="130" stroke-width="0.8"/>
    <line x1="130" y1="170" x2="175" y2="170" stroke-width="0.8"/>
    <line x1="125" y1="210" x2="185" y2="210" stroke-width="0.8"/>

    <!-- Palm Trees Left -->
    <g transform="translate(240, 250)">
      <path d="M 0,0 C -5,-30 0,-60 5,-80" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
      <!-- Fronds -->
      <path d="M 5,-80 C -15,-95 -35,-90 -45,-80" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <path d="M 5,-80 C -10,-105 -20,-115 -35,-110" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <path d="M 5,-80 C 10,-115 20,-120 30,-110" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <path d="M 5,-80 C 25,-105 40,-95 45,-85" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Mid Rise Buildings -->
    <rect x="290" y="160" width="45" height="90" rx="2" />
    <line x1="305" y1="170" x2="305" y2="240" stroke-width="0.8"/>
    <line x1="320" y1="170" x2="320" y2="240" stroke-width="0.8"/>

    <rect x="345" y="130" width="55" height="120" rx="3" />
    <!-- Grid windows -->
    <line x1="350" y1="150" x2="395" y2="150" stroke-width="0.8"/>
    <line x1="350" y1="175" x2="395" y2="175" stroke-width="0.8"/>
    <line x1="350" y1="200" x2="395" y2="200" stroke-width="0.8"/>
    <line x1="350" y1="225" x2="395" y2="225" stroke-width="0.8"/>

    <!-- High Rise Towers Center -->
    <rect x="420" y="100" width="60" height="150" rx="3" />
    <polygon points="450,70 420,100 480,100" />
    <line x1="450" y1="50" x2="450" y2="70" stroke-width="2"/>

    <!-- Giant Iconic Tower (Center Burj Khalifa style spire) -->
    <path d="M 620,250 L 610,140 L 615,80 L 618,30 L 620,10 L 622,30 L 625,80 L 630,140 L 620,250 Z" />
    <line x1="620" y1="10" x2="620" y2="250" stroke-width="0.8"/>
    <!-- Setbacks -->
    <line x1="612" y1="160" x2="628" y2="160" stroke-width="1"/>
    <line x1="615" y1="110" x2="625" y2="110" stroke-width="1"/>
    <line x1="617" y1="60" x2="623" y2="60" stroke-width="1"/>

    <!-- Right Side Skyline -->
    <rect x="670" y="120" width="50" height="130" rx="2" />
    <rect x="730" y="150" width="60" height="100" rx="2" />
    <polygon points="760,125 730,150 790,150" />

    <!-- Palm Trees Right -->
    <g transform="translate(850, 250)">
      <path d="M 0,0 C 5,-25 0,-55 -5,-75" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
      <path d="M -5,-75 C -25,-90 -45,-85 -50,-75" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <path d="M -5,-75 C -15,-100 -25,-110 -40,-105" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <path d="M -5,-75 C 10,-105 25,-110 35,-100" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
      <path d="M -5,-75 C 20,-95 35,-85 40,-75" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    </g>

    <rect x="910" y="110" width="55" height="140" rx="3" />
    <rect x="980" y="160" width="70" height="90" rx="2" />
    <path d="M 1060,250 C 1070,210 1065,160 1090,120 C 1105,160 1115,210 1120,250 Z" />
  </g>

  <!-- Horizontal Ground / Road line -->
  <line x1="40" y1="250" x2="1160" y2="250" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Location Map Pins with Cars along the road -->
  <!-- Pin 1 -->
  <g transform="translate(170, 220)">
    <path d="M 0,0 C -12,0 -20,-10 -20,-22 C -20,-35 0,-52 0,-52 C 0,-52 20,-35 20,-22 C 20,-10 12,0 0,0 Z" fill="#64748b"/>
    <circle cx="0" cy="-24" r="14" fill="#ffffff"/>
    <!-- Tiny car icon inside pin -->
    <path d="M -7,-22 C -6,-26 -4,-27 -2,-27 L 2,-27 C 4,-27 6,-26 7,-22 L 8,-19 L -8,-19 Z" fill="#475569"/>
    <circle cx="-5" cy="-19" r="1.8" fill="#1e293b"/>
    <circle cx="5" cy="-19" r="1.8" fill="#1e293b"/>
  </g>

  <!-- Pin 2 (Active Lime Green Pin above car) -->
  <g transform="translate(480, 215)">
    <path d="M 0,0 C -14,0 -24,-12 -24,-26 C -24,-42 0,-62 0,-62 C 0,-62 24,-42 24,-26 C 24,-12 14,0 0,0 Z" fill="#a0cc28"/>
    <circle cx="0" cy="-28" r="16" fill="#ffffff"/>
    <path d="M -8,-26 C -7,-30 -4,-32 -2,-32 L 2,-32 C 4,-32 7,-30 8,-26 L 9,-23 L -9,-23 Z" fill="#2d3748"/>
    <circle cx="-6" cy="-22" r="2.2" fill="#1a202c"/>
    <circle cx="6" cy="-22" r="2.2" fill="#1a202c"/>
  </g>

  <!-- Pin 3 -->
  <g transform="translate(710, 220)">
    <path d="M 0,0 C -12,0 -20,-10 -20,-22 C -20,-35 0,-52 0,-52 C 0,-52 20,-35 20,-22 C 20,-10 12,0 0,0 Z" fill="#64748b"/>
    <circle cx="0" cy="-24" r="14" fill="#ffffff"/>
    <path d="M -7,-22 C -6,-26 -4,-27 -2,-27 L 2,-27 C 4,-27 6,-26 7,-22 L 8,-19 L -8,-19 Z" fill="#475569"/>
    <circle cx="-5" cy="-19" r="1.8" fill="#1e293b"/>
    <circle cx="5" cy="-19" r="1.8" fill="#1e293b"/>
  </g>

  <!-- Pin 4 -->
  <g transform="translate(890, 220)">
    <path d="M 0,0 C -12,0 -20,-10 -20,-22 C -20,-35 0,-52 0,-52 C 0,-52 20,-35 20,-22 C 20,-10 12,0 0,0 Z" fill="#64748b"/>
    <circle cx="0" cy="-24" r="14" fill="#ffffff"/>
    <path d="M -7,-22 C -6,-26 -4,-27 -2,-27 L 2,-27 C 4,-27 6,-26 7,-22 L 8,-19 L -8,-19 Z" fill="#475569"/>
    <circle cx="-5" cy="-19" r="1.8" fill="#1e293b"/>
    <circle cx="5" cy="-19" r="1.8" fill="#1e293b"/>
  </g>

  <!-- Pin 5 -->
  <g transform="translate(1040, 220)">
    <path d="M 0,0 C -12,0 -20,-10 -20,-22 C -20,-35 0,-52 0,-52 C 0,-52 20,-35 20,-22 C 20,-10 12,0 0,0 Z" fill="#64748b"/>
    <circle cx="0" cy="-24" r="14" fill="#ffffff"/>
    <path d="M -7,-22 C -6,-26 -4,-27 -2,-27 L 2,-27 C 4,-27 6,-26 7,-22 L 8,-19 L -8,-19 Z" fill="#475569"/>
    <circle cx="-5" cy="-19" r="1.8" fill="#1e293b"/>
    <circle cx="5" cy="-19" r="1.8" fill="#1e293b"/>
  </g>

  <!-- Sleek White Modern Sedan Driving on the Road (Matching reference) -->
  <g transform="translate(370, 218)" filter="url(#carShadowSoft)">
    <!-- Shadow -->
    <ellipse cx="115" cy="40" rx="110" ry="8" fill="#000000" opacity="0.35"/>
    <!-- Car body (white / silver sedan) -->
    <!-- Lower body -->
    <path d="M 20,34 C 30,34 38,20 54,20 C 70,20 155,20 172,20 C 188,20 196,34 212,34 C 224,34 232,28 230,20 C 228,14 215,10 195,8 C 175,6 158,-12 135,-12 C 110,-12 80,-2 60,6 C 40,14 18,16 12,24 C 6,32 12,34 20,34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Roof glass -->
    <path d="M 68,6 C 85,-1 110,-9 135,-9 C 152,-9 168,2 185,8 C 160,8 140,8 115,8 C 95,8 80,7 68,6 Z" fill="#334155"/>
    <line x1="125" y1="-9" x2="125" y2="8" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Headlight & taillight -->
    <path d="M 12,24 C 18,22 25,22 28,24" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
    <path d="M 228,20 C 224,18 218,18 216,20" stroke="#ef4444" stroke-width="2.5" fill="none"/>
    <!-- Door seam & handle -->
    <line x1="122" y1="8" x2="122" y2="30" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="105" y="14" width="8" height="2" rx="1" fill="#94a3b8"/>
    <rect x="135" y="14" width="8" height="2" rx="1" fill="#94a3b8"/>
    <!-- Front Wheel -->
    <circle cx="54" cy="34" r="14" fill="#1e293b"/>
    <circle cx="54" cy="34" r="9" fill="#94a3b8"/>
    <circle cx="54" cy="34" r="3" fill="#ffffff"/>
    <!-- Rear Wheel -->
    <circle cx="172" cy="34" r="14" fill="#1e293b"/>
    <circle cx="172" cy="34" r="9" fill="#94a3b8"/>
    <circle cx="172" cy="34" r="3" fill="#ffffff"/>
  </g>

  <!-- 5 Carousel Pagination Dots at bottom (matching reference) -->
  <g transform="translate(600, 310)">
    <circle cx="-32" cy="0" r="4.5" fill="#cbd5e1"/>
    <circle cx="-16" cy="0" r="4.5" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="5" fill="#475569"/>
    <circle cx="16" cy="0" r="4.5" fill="#cbd5e1"/>
    <circle cx="32" cy="0" r="4.5" fill="#cbd5e1"/>
  </g>
</svg>
